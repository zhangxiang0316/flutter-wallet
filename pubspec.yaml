name: omnicast
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.8
  get:
  flutter_screenutil:
  flutter_localizations:
    sdk: flutter
  intl: #中英文
  lifecycle:
  shared_preferences:
  dio:
  logger:
  json_annotation: ^4.9.0
  cached_network_image:
  flutter_smart_dialog:
  styled_widget:
  pretty_dio_logger:
  getx_route_annotations:
  flutter_svg: ^2.2.3
  image_picker: ^1.2.1
  easy_refresh: ^3.4.0  #下拉刷新


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  intl_utils:  #国际化
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  getx_route_generator:

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/img/
    - assets/svg/
